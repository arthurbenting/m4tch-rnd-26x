<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match Randomizer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}
body{touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#cameraArea{height:50%;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
#camera{width:100%;height:100%;object-fit:contain;transform:scaleX(-1);background:#111}
#matchArea{
 height:50%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(115deg,#f31362 0%,#ff385c 48%,#ff5a52 100%);
}
#card{
 width:min(51vw,275px); height:min(40vh,430px); background:white;border-radius:28px;
 padding:12px 12px 14px; box-shadow:0 12px 34px rgba(0,0,0,.22);
 display:flex;flex-direction:column;gap:11px; transform:translate3d(0,0,0) rotate(0deg);
 transition:transform .25s ease,opacity .25s ease;
}
#photoWrap{flex:1;min-height:0;border-radius:22px;overflow:hidden;background:#eee;position:relative}
#photo{width:100%;height:100%;object-fit:cover;display:block}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-weight:800;text-align:center;padding:20px}
#buttons{height:54px;display:flex;align-items:center;justify-content:center;gap:24px}
.action{
 width:48px;height:48px;border-radius:50%;border:0;background:white;box-shadow:0 3px 13px rgba(0,0,0,.14);
 display:grid;place-items:center;font-size:26px;font-weight:900;cursor:pointer;
}
#nope{color:#f22b64} #star{color:#19bfe8;font-size:24px} #like{color:#28e5a5}
.stamp{position:absolute;top:14%;z-index:5;padding:6px 10px;border:5px solid;border-radius:8px;font-size:30px;font-weight:900;opacity:0;pointer-events:none}
#likeStamp{left:9%;color:#28e5a5;transform:rotate(-14deg)}
#nopeStamp{right:9%;color:#f22b64;transform:rotate(14deg)}
#start{position:fixed;inset:0;z-index:20;background:#111;color:white;display:grid;place-items:center;text-align:center;padding:28px}
#start>div{max-width:420px}
#start h1{font-size:34px;margin:0 0 12px}
#start p{color:#bbb;line-height:1.4;margin:0 0 22px}
#start button{border:0;border-radius:999px;padding:16px 24px;font-size:18px;font-weight:900}
#status{margin-top:14px;color:#aaa;font-size:13px}
@media(max-height:720px){#card{height:42vh}.action{width:42px;height:42px}#buttons{height:46px}}
</style>
</head>
<body>
<div id="app">
 <div id="cameraArea"><video id="camera" autoplay muted playsinline></video></div>
 <div id="matchArea">
   <div id="likeStamp" class="stamp">MATCH</div>
   <div id="nopeStamp" class="stamp">NOPE</div>
   <div id="card">
     <div id="photoWrap">
       <div id="loading">TOQUE EM ❤️ OU ❌</div>
       <img id="photo" alt="" hidden>
     </div>
     <div id="buttons">
       <button class="action" id="nope" aria-label="Passar">×</button>
       <button class="action" id="star" aria-label="Super match">★</button>
       <button class="action" id="like" aria-label="Match">♥</button>
     </div>
   </div>
 </div>
</div>

<div id="start">
 <div>
  <h1>Match Randomizer</h1>
  <p>Câmera em cima, perfis embaixo. Use ❌, ★ ou ♥ para avançar. Você também pode arrastar o card.</p>
  <button id="cameraBtn">ATIVAR CÂMERA</button>
  <div id="status"></div>
 </div>
</div>

<script>
// Protótipo: sobremesas brasileiras. As imagens são buscadas automaticamente na Wikipédia.
const profiles=[
 ["Brigadeiro","Brigadeiro"],
 ["Pudim de leite condensado","Pudim_de_leite_condensado"],
 ["Quindim","Quindim"],
 ["Paçoca","Paçoca"],
 ["Cocada","Cocada"],
 ["Pamonha","Pamonha"],
 ["Bolo de rolo","Bolo_de_rolo"],
 ["Romeu e Julieta","Romeu_e_Julieta"],
 ["Goiabada","Goiabada"],
 ["Pé de moleque","Pé_de_moleque"],
 ["Beijinho","Beijinho_(doce)"],
 ["Maria-mole","Maria-mole"],
 ["Bolo de cenoura","Bolo_de_cenoura"],
 ["Doce de leite","Doce_de_leite"],
 ["Bolinho de chuva","Bolinho_de_chuva"]
];

const camera=document.getElementById("camera"), card=document.getElementById("card"),
photo=document.getElementById("photo"), loading=document.getElementById("loading"),
start=document.getElementById("start"), cameraBtn=document.getElementById("cameraBtn"),
status=document.getElementById("status"), likeStamp=document.getElementById("likeStamp"),
nopeStamp=document.getElementById("nopeStamp");

let bag=[],current=null,cache=new Map(),busy=false,startX=0,dx=0,dragging=false;

function shuffle(){
 bag=[...Array(profiles.length).keys()];
 for(let i=bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
}
async function imageFor(i){
 if(cache.has(i)) return cache.get(i);
 try{
   let r=await fetch("https://pt.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(profiles[i][1]));
   let d=await r.json();
   let src=(d.originalimage&&d.originalimage.source)||(d.thumbnail&&d.thumbnail.source)||"";
   cache.set(i,src); return src;
 }catch(e){return ""}
}
async function next(){
 if(!bag.length)shuffle();
 current=bag.pop();
 loading.hidden=false; loading.textContent="CARREGANDO…"; photo.hidden=true;
 const src=await imageFor(current);
 if(src){photo.src=src;photo.alt=profiles[current][0];photo.hidden=false;loading.hidden=true}
 else{loading.textContent=profiles[current][0]}
 card.style.transition="none";card.style.transform="translate3d(0,0,0) rotate(0deg)";card.style.opacity="1";
 likeStamp.style.opacity=0;nopeStamp.style.opacity=0;busy=false;
}
function decide(dir){
 if(busy)return;busy=true;
 const right=dir==="right";
 likeStamp.style.opacity=right?1:0;nopeStamp.style.opacity=right?0:1;
 card.style.transition="transform .28s ease,opacity .28s ease";
 card.style.transform=`translate3d(${right?120:-120}vw,0,0) rotate(${right?18:-18}deg)`;
 card.style.opacity=".35";
 setTimeout(next,300);
}
document.getElementById("like").onclick=e=>{e.stopPropagation();decide("right")};
document.getElementById("nope").onclick=e=>{e.stopPropagation();decide("left")};
document.getElementById("star").onclick=e=>{e.stopPropagation();decide("right")};

card.addEventListener("pointerdown",e=>{
 if(busy)return;dragging=true;startX=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition="none";
});
card.addEventListener("pointermove",e=>{
 if(!dragging||busy)return;dx=e.clientX-startX;
 card.style.transform=`translate3d(${dx}px,0,0) rotate(${dx/18}deg)`;
 likeStamp.style.opacity=dx>45?Math.min(1,(dx-45)/60):0;
 nopeStamp.style.opacity=dx<-45?Math.min(1,(-dx-45)/60):0;
});
card.addEventListener("pointerup",()=>{
 if(!dragging||busy)return;dragging=false;
 if(dx>90)return decide("right"); if(dx<-90)return decide("left");
 card.style.transition="transform .2s ease";card.style.transform="translate3d(0,0,0) rotate(0deg)";
 likeStamp.style.opacity=0;nopeStamp.style.opacity=0;
});

cameraBtn.onclick=async()=>{
 status.textContent="Abrindo câmera…";
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
  camera.srcObject=stream;await camera.play();start.style.display="none";shuffle();next();
  profiles.forEach((_,i)=>imageFor(i));
 }catch(e){status.textContent="Não foi possível abrir a câmera. Verifique a permissão do navegador."}
};
</script>
</body>
</html>
