<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match Randomizer V2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,Helvetica,sans-serif}
body{touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#cameraArea{height:50%;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
#camera{width:100%;height:100%;object-fit:contain;transform:scaleX(-1);background:#111}
#matchArea{height:50%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
background:linear-gradient(115deg,#f31362 0%,#ff385c 48%,#ff5a52 100%);touch-action:none}
#card{
 width:min(51vw,275px);
 height:min(32vh,344px); /* 80% da altura anterior */
 background:#fff;border-radius:28px;padding:11px 11px 12px;
 box-shadow:0 12px 34px rgba(0,0,0,.22);
 display:flex;flex-direction:column;gap:8px;
 transform:translate3d(0,0,0);transition:transform .25s ease,opacity .25s ease;
 touch-action:none;will-change:transform;
}
#photoWrap{flex:1;min-height:0;border-radius:21px;overflow:hidden;background:#eee;position:relative}
#photo{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-weight:800;text-align:center;padding:15px}
#buttons{height:48px;display:flex;align-items:center;justify-content:center;gap:22px}
.action{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 13px rgba(0,0,0,.14);
display:grid;place-items:center;font-size:25px;font-weight:900;touch-action:manipulation}
#nope{color:#f22b64}#star{color:#19bfe8;font-size:23px}#like{color:#28e5a5}
.stamp{position:absolute;z-index:8;padding:5px 9px;border:4px solid;border-radius:7px;font-size:27px;font-weight:900;
opacity:0;pointer-events:none;text-shadow:0 2px 5px rgba(0,0,0,.08)}
#likeStamp{top:12%;left:8%;color:#28e5a5;transform:rotate(-14deg)}
#nopeStamp{top:12%;right:8%;color:#f22b64;transform:rotate(14deg)}
#superStamp{left:50%;top:7%;color:#19bfe8;transform:translateX(-50%) rotate(-3deg)}
#start{position:fixed;inset:0;z-index:20;background:#111;color:#fff;display:grid;place-items:center;text-align:center;padding:28px}
#start>div{max-width:420px}#start h1{font-size:34px;margin:0 0 12px}#start p{color:#bbb;line-height:1.4;margin:0 0 22px}
#start button{border:0;border-radius:999px;padding:16px 24px;font-size:18px;font-weight:900}
#status{margin-top:14px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div id="app">
 <div id="cameraArea"><video id="camera" autoplay muted playsinline></video></div>
 <div id="matchArea">
   <div id="likeStamp" class="stamp">LIKE</div>
   <div id="nopeStamp" class="stamp">NOPE</div>
   <div id="superStamp" class="stamp">SUPER LIKE</div>
   <div id="card">
     <div id="photoWrap"><div id="loading">CARREGANDO…</div><img id="photo" alt="" hidden></div>
     <div id="buttons">
       <button class="action" id="nope">×</button>
       <button class="action" id="star">★</button>
       <button class="action" id="like">♥</button>
     </div>
   </div>
 </div>
</div>
<div id="start"><div>
 <h1>Match Randomizer</h1>
 <p>❌ passa, ♥ dá like e ★ dá super like. Você também pode arrastar para esquerda, direita ou para cima.</p>
 <button id="cameraBtn">ATIVAR CÂMERA</button><div id="status"></div>
</div></div>
<script>
const profiles=[
["Brigadeiro","Brigadeiro"],["Pudim de leite condensado","Pudim_de_leite_condensado"],["Quindim","Quindim"],
["Paçoca","Paçoca"],["Cocada","Cocada"],["Pamonha","Pamonha"],["Bolo de rolo","Bolo_de_rolo"],
["Romeu e Julieta","Romeu_e_Julieta"],["Goiabada","Goiabada"],["Pé de moleque","Pé_de_moleque"],
["Beijinho","Beijinho_(doce)"],["Maria-mole","Maria-mole"],["Bolo de cenoura","Bolo_de_cenoura"],
["Doce de leite","Doce_de_leite"],["Bolinho de chuva","Bolinho_de_chuva"]
];
const $=id=>document.getElementById(id);
const camera=$("camera"),card=$("card"),photo=$("photo"),loading=$("loading"),start=$("start"),
status=$("status"),likeStamp=$("likeStamp"),nopeStamp=$("nopeStamp"),superStamp=$("superStamp");
let bag=[],cache=new Map(),busy=false,dragging=false,startX=0,startY=0,dx=0,dy=0,pid=null;

function shuffle(){bag=[...Array(profiles.length).keys()];for(let i=bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
async function imageFor(i){
 if(cache.has(i))return cache.get(i);
 try{let r=await fetch("https://pt.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(profiles[i][1]));
 let d=await r.json();let src=(d.originalimage&&d.originalimage.source)||(d.thumbnail&&d.thumbnail.source)||"";cache.set(i,src);return src}catch(e){return ""}
}
function stamps(a,b,c){likeStamp.style.opacity=a;nopeStamp.style.opacity=b;superStamp.style.opacity=c}
async function next(){
 if(!bag.length)shuffle();let i=bag.pop();loading.hidden=false;loading.textContent="CARREGANDO…";photo.hidden=true;
 const src=await imageFor(i);if(src){photo.src=src;photo.alt=profiles[i][0];photo.hidden=false;loading.hidden=true}else loading.textContent=profiles[i][0];
 card.style.transition="none";card.style.transform="translate3d(0,0,0) rotate(0deg)";card.style.opacity="1";stamps(0,0,0);busy=false;
}
function decide(dir){
 if(busy)return;busy=true;card.style.transition="transform .3s ease,opacity .3s ease";
 if(dir==="right"){stamps(1,0,0);card.style.transform="translate3d(125vw,0,0) rotate(18deg)"}
 if(dir==="left"){stamps(0,1,0);card.style.transform="translate3d(-125vw,0,0) rotate(-18deg)"}
 if(dir==="up"){stamps(0,0,1);card.style.transform="translate3d(0,-90vh,0) scale(.92)"}
 card.style.opacity=".3";setTimeout(next,320);
}
$("like").addEventListener("click",e=>{e.stopPropagation();decide("right")});
$("nope").addEventListener("click",e=>{e.stopPropagation();decide("left")});
$("star").addEventListener("click",e=>{e.stopPropagation();decide("up")});

card.addEventListener("pointerdown",e=>{
 if(busy)return;e.preventDefault();dragging=true;pid=e.pointerId;startX=e.clientX;startY=e.clientY;dx=dy=0;
 card.setPointerCapture(pid);card.style.transition="none";
},{passive:false});
card.addEventListener("pointermove",e=>{
 if(!dragging||busy)return;e.preventDefault();dx=e.clientX-startX;dy=e.clientY-startY;
 const upward=Math.max(0,-dy);
 card.style.transform=`translate3d(${dx}px,${dy}px,0) rotate(${dx/18}deg)`;
 if(upward>Math.abs(dx) && upward>35) stamps(0,0,Math.min(1,(upward-35)/70));
 else if(dx>35) stamps(Math.min(1,(dx-35)/70),0,0);
 else if(dx<-35) stamps(0,Math.min(1,(-dx-35)/70),0);
 else stamps(0,0,0);
},{passive:false});
function release(){
 if(!dragging||busy)return;dragging=false;
 if(-dy>85 && -dy>Math.abs(dx))return decide("up");
 if(dx>80)return decide("right");if(dx<-80)return decide("left");
 card.style.transition="transform .2s ease";card.style.transform="translate3d(0,0,0) rotate(0deg)";stamps(0,0,0);
}
card.addEventListener("pointerup",release);card.addEventListener("pointercancel",release);

$("cameraBtn").onclick=async()=>{
 status.textContent="Abrindo câmera…";
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
 camera.srcObject=stream;await camera.play();start.style.display="none";shuffle();next();profiles.forEach((_,i)=>imageFor(i))}
 catch(e){status.textContent="Não foi possível abrir a câmera. Verifique a permissão do navegador."}
};
</script>
</body>
</html>
